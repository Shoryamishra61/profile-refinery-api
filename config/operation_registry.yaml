version: 2
operations:
  # Primary operation. LIVE_VERIFIED 2026-08-28: observed HTTP 200 with a real
  # member payload (publicIdentifier + firstName/lastName/headline/summary/
  # profilePicture/backgroundPicture verified against the live entity).
  - semantic_name: profile_view
    enabled: true
    evidence_status: live_verified
    kind: restli
    method: GET
    path: /voyager/api/identity/dash/profiles
    transport_family: restli
    parser: full_profile_v1
    decoration_ids: []
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md#dash-profiles
  # Full-profile projection: single-call attempt for every section. Decorations
  # rotate; tried before per-section cards when sections are missing.
  - semantic_name: profile_view_full
    enabled: true
    evidence_status: historical
    kind: restli
    method: GET
    path: /voyager/api/identity/dash/profiles
    transport_family: restli
    parser: full_profile_v1
    decoration_ids:
      - com.linkedin.voyager.dash.deco.identity.profile.WebFullProfileWithEntityActions-20
      - com.linkedin.voyager.dash.deco.identity.profile.WebFullProfileWithEntityActions-19
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md#dash-profiles
  # Per-section profile cards. The core entity references
  # urn:li:fsd_profileCard:({memberId},{SECTION},{locale}); the card resource
  # answers for {memberId}-{SECTION}-{locale}. Parsed with the matching
  # section parser by the orchestrator.
  - semantic_name: profile_sections
    enabled: true
    evidence_status: historical
    kind: restli
    method: GET
    path: /voyager/api/identity/dash/profileCards/{resource_id}
    transport_family: restli
    parser: full_profile_v1
    decoration_ids: []
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md#profile-cards
  # Fallback operation: direct authenticated fetch of the profile page itself
  # and extraction of embedded Voyager JSON. Pure HTTP; no browser.
  - semantic_name: profile_page
    enabled: true
    evidence_status: historical
    kind: html
    method: GET
    path: /in/{slug}/
    transport_family: web
    parser: full_profile_v1
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md#embedded-page-json
