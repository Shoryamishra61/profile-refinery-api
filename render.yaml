services:
  - type: web
    name: tross-linkedin-profile-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: live
      - key: APP_API_KEYS
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: LINKEDIN_PROFILE_CORE_QUERY_ID
        sync: false
      - key: LINKEDIN_EXPERIENCE_QUERY_ID
        sync: false
      - key: LINKEDIN_EDUCATION_QUERY_ID
        sync: false
      - key: LINKEDIN_SKILLS_QUERY_ID
        sync: false
      - key: LINKEDIN_CERTIFICATIONS_QUERY_ID
        sync: false
      - key: LINKEDIN_LANGUAGES_QUERY_ID
        sync: false

