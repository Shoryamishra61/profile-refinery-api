services:
  - type: web
    name: tross-linkedin-profile-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: live
      - key: APP_API_KEYS
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: LINKEDIN_COOKIE
        sync: false
      - key: LINKEDIN_EGRESS_PROXY
        sync: false
      - key: LINKEDIN_USER_AGENT
        sync: false
      - key: LINKEDIN_ACCEPT_LANGUAGE
        sync: false

