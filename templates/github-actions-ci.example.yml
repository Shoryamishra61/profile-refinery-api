name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: No browser runtime dependencies
        run: |
          if grep -RniE 'selenium|playwright|puppeteer|chromium' pyproject.toml src/; then exit 1; fi
