version: 2
operations:
  # Example: primary member-finder operation (live-verified shape).
  - semantic_name: profile_view
    enabled: true
    evidence_status: live_verified   # live_verified | historical | disabled | unknown
    kind: restli                     # restli | html
    method: GET
    path: /voyager/api/identity/dash/profiles
    transport_family: restli
    parser: full_profile_v1
    decoration_ids: []               # optional decoration projections
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md
  # Example: embedded-page fallback (direct HTTP fetch of the profile page).
  - semantic_name: profile_page
    enabled: true
    evidence_status: historical
    kind: html
    method: GET
    path: /in/{slug}/
    transport_family: web
    parser: full_profile_v1
    observed_at: 2026-08-29T00:00:00Z
    evidence_reference: docs/REVERSE_ENGINEERING_PROTOCOL.md
